<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARMSCON — Star Night & contest</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body data-page="register">
  <main class="page-main page-pad">
    <h1 class="page-title">Star Night &amp; Mr &amp; Miss ARMSCON</h1>
    <form class="form" data-extras-form>
      <h2>Star Night</h2>
      <p>Evening artist set. Separate QR from day passes.</p>
      <label><input type="radio" name="star" value="yes" checked> Yes — include Star Night pass</label><br>
      <label><input type="radio" name="star" value="no"> No Star Night</label>
      <h2 style="margin-top:24px">Mr &amp; Miss ARMSCON</h2>
      <p>Pageant / personality round. Skip if not entering.</p>
      <label><input type="radio" name="contest" value="mr"> Enter as Mr ARMSCON</label><br>
      <label><input type="radio" name="contest" value="miss"> Enter as Miss ARMSCON</label><br>
      <label><input type="radio" name="contest" value="skip" checked> Skip contest</label>
      <p><button class="ghost" type="submit">Go to payment</button></p>
    </form>
  </main>
  <script src="js/wireframe.js"></script>
</body>
</html>
