<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARMSCON — Events</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body data-page="events">
  <main class="page-main page-pad">
    <h1 class="page-title">Events</h1>
    <p class="dev-note">Same slider + slide-up pattern as Workshops. Content is competitions / academic events.</p>
    <div class="slider">
      <span class="wf-label">Poster slider</span>
      <div class="slider-track" data-slider-track>
        <button class="poster" type="button" data-title="Med quiz" data-body="Team of 3. Prelims on Day 1, finals Day 2. Open to all colleges.">
          <span class="wf-label">Poster</span><strong>Med quiz</strong>
        </button>
        <button class="poster" type="button" data-title="Debate" data-body="Motion announced 24 hours prior. English. Knockout from quarter-finals.">
          <span class="wf-label">Poster</span><strong>Debate</strong>
        </button>
        <button class="poster" type="button" data-title="Case presentation" data-body="8 minutes + 2 questions. Submit abstract with registration.">
          <span class="wf-label">Poster</span><strong>Case presentation</strong>
        </button>
        <button class="poster" type="button" data-title="Treasure hunt" data-body="Campus-wide clues. Teams of 4. Day 3 afternoon.">
          <span class="wf-label">Poster</span><strong>Treasure hunt</strong>
        </button>
        <button class="poster" type="button" data-title="Paper poster" data-body="Printed poster 3×4 ft. Judging Day 2. Certificates for shortlist.">
          <span class="wf-label">Poster</span><strong>Paper poster</strong>
        </button>
      </div>
    </div>
  </main>
  <aside class="sheet" data-sheet>
    <button class="sheet-close" type="button" data-sheet-close>Close</button>
    <h2 data-sheet-title></h2>
    <p data-sheet-body></p>
    <a class="ghost" href="profile.html">Register</a>
  </aside>
  <script src="js/wireframe.js"></script>
</body>
</html>
