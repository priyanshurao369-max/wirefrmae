<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARMSCON — My profile</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body class="page-bg" data-page="profile">
  <main class="page-main hub">
    <div class="side-sponsors">
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
    </div>
    <div class="hub-center">
      <div class="info-card">
        <span class="wf-label" style="position:relative">Basic info</span>
        <div data-profile-info></div>
        <a class="ghost" href="profile.html" style="background:#fff;color:#161616;margin-right:8px">Logout</a>
        <a class="ghost" href="#tickets" data-open-tickets>Ticket</a>
      </div>
      <div class="ticket-panel" data-ticket-panel id="tickets">
        <h2>Passes</h2>
        <p class="dev-note">4 QR tickets: Day 1 / Day 2 / Day 3 + Star Night. Production will generate real QR codes.</p>
        <div class="qr-grid">
          <div class="qr-card"><div class="qr"></div><p>Day 1<br>19 Nov 2026</p></div>
          <div class="qr-card"><div class="qr"></div><p>Day 2<br>20 Nov 2026</p></div>
          <div class="qr-card"><div class="qr"></div><p>Day 3<br>21 Nov 2026</p></div>
          <div class="qr-card"><div class="qr"></div><p>Star Night</p></div>
        </div>
      </div>
    </div>
    <div class="side-sponsors">
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
    </div>
    <div class="sponsor-under">
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
      <div class="icon-slot"><span class="wf-label">Sp</span></div>
    </div>
  </main>
  <script src="js/wireframe.js"></script>
</body>
</html>
