<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARMSCON — Workshops</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body data-page="workshops">
  <main class="page-main page-pad">
    <h1 class="page-title">Workshops</h1>
    <p class="dev-note">DEV NOTE: Posters auto-slide sideways. Tap a poster — it slides up with description. Swap dummy titles with real workshop list.</p>
    <div class="slider">
      <span class="wf-label">Poster slider</span>
      <div class="slider-track" data-slider-track>
        <button class="poster" type="button" data-title="Suturing lab" data-body="Hands-on basic and advanced suturing for undergraduates. Limited seats. Bring your college ID. Held Day 1 morning, skill lab block B.">
          <span class="wf-label">Poster</span><strong>Suturing lab</strong>
        </button>
        <button class="poster" type="button" data-title="ECG bootcamp" data-body="Read strips, spot the emergency, leave with a pocket algorithm. Faculty from medicine. Day 1 afternoon.">
          <span class="wf-label">Poster</span><strong>ECG bootcamp</strong>
        </button>
        <button class="poster" type="button" data-title="Research writing" data-body="From question to abstract. Mentors review one draft per participant. Day 2 morning.">
          <span class="wf-label">Poster</span><strong>Research writing</strong>
        </button>
        <button class="poster" type="button" data-title="USG basics" data-body="Probe handling and FAST protocol demo. Small batches. Day 2 afternoon.">
          <span class="wf-label">Poster</span><strong>USG basics</strong>
        </button>
        <button class="poster" type="button" data-title="Theatre etiquette" data-body="OR flow, scrub, and first-assist expectations. Day 3 morning.">
          <span class="wf-label">Poster</span><strong>Theatre etiquette</strong>
        </button>
      </div>
    </div>
  </main>
  <aside class="sheet" data-sheet>
    <button class="sheet-close" type="button" data-sheet-close>Close</button>
    <h2 data-sheet-title></h2>
    <p data-sheet-body></p>
    <a class="ghost" href="profile.html">Register</a>
  </aside>
  <script src="js/wireframe.js"></script>
</body>
</html>
